name: reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Run unit and frozen-transform tests
        run: make test

      - name: Verify repository manifest
        run: make manifest-check

      - name: Audit nominal bootstrap provenance boundary
        run: make bootstrap-audit

      - name: Reproduce legacy quick run
        run: make frozen-quick

      - name: Exercise corrected candidate quick run
        run: make quick
